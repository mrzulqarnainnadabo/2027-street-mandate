name: Live Evidence Vault Contract

on:
  push:
    branches:
      - main
    paths:
      - scripts/verify-live-evidence-vault.mjs
      - .github/workflows/live-evidence-vault.yml
  workflow_dispatch:
  schedule:
    - cron: "15 8 * * *"

permissions:
  contents: read

concurrency:
  group: live-evidence-vault-contract
  cancel-in-progress: false

jobs:
  verify:
    name: Verify production Evidence Vault feed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check published dual-reviewed evidence
        run: node scripts/verify-live-evidence-vault.mjs
