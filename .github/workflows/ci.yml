name: Civic Mandate CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: civic-mandate-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test and build Civic Mandate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run source and governance regression checks
        run: npm test
      - name: Build production application
        run: npm run build
