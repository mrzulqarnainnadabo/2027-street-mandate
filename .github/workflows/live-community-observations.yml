name: Live Community Observation Contract

on:
  push:
    branches:
      - main
    paths:
      - scripts/verify-live-community-observations.mjs
      - .github/workflows/live-community-observations.yml
  workflow_dispatch:
  schedule:
    - cron: "45 7 * * *"

permissions:
  contents: read

concurrency:
  group: live-community-observation-contract
  cancel-in-progress: false

jobs:
  verify:
    name: Verify production observation feed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Check live published-only contract
        run: node scripts/verify-live-community-observations.mjs
