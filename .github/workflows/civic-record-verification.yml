name: Civic Record verification

on:
  push:
    branches:
      - "feat/**"
      - "fix/**"
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Generate CI-only dependency lock for audit
        run: npm install --package-lock-only --ignore-scripts
      - name: Audit dependency vulnerabilities and report affected packages
        run: |
          npm audit --json > npm-audit-report.json || true
          node -e 'const r = require("./npm-audit-report.json"); const items = Object.entries(r.vulnerabilities || {}); console.log(JSON.stringify(items.map(([name, v]) => ({ name, severity: v.severity, direct: v.isDirect, range: v.range, via: v.via, effects: v.effects, nodes: v.nodes, fixAvailable: v.fixAvailable })), null, 2)); if (items.some(([, v]) => ["high", "critical"].includes(v.severity))) process.exit(1)'
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build
