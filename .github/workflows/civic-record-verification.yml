name: Civic Record verification

on:
  push:
    branches:
      - "feat/**"
      - "fix/**"
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Generate CI-only dependency lock for audit
        run: npm install --package-lock-only --ignore-scripts
      - name: Audit dependency vulnerabilities
        run: npm audit --audit-level=high
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build
